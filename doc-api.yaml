openapi: 3.0.3
info:
  title: DSocal start 10/2023
  description: |-
    ## This is server api of Socal created by Tran Thu Dat
  contact:
    email: trandat.dev12@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.11
servers:
  - url: http://localhost:1236
    description: 'API dev'
  - url: https://petstore3.swagger.io/api/v3
    description: 'API production'
tags:
  - name: Users
    description: Everything about your Users
  - name: Followers
    description: handle Follower
  - name: Tweets
    description: ref to Tweets
  - name: Hashtags
    description: ref to Hashtags
  - name: Bookmarks
    description: ref to bookmarks
  - name: Company
    description: Company information and services

paths:
  /users/login:
    post:
      tags:
        - Users
      summary: Đăng nhập
      description: Đăng nhập vào hệ thống
      operationId: login
      requestBody:
        description: Thông tin đăng nhập
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
        required: true
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuthentication'
        '422':
          description: Invalid input

  /users/get-me:
    get:
      tags:
        - Users
      summary: Thông tin tài khoản đăng nhập
      description: Thông tin tài khoản đăng nhập
      operationId: get me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Get me thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'

  /users/register:
    post:
      tags:
        - Users
      summary: Đăng ký
      description: Đăng ký vào hệ thống
      operationId: register
      requestBody:
        description: Thông tin đăng nhập
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUser'
        required: true
      responses:
        '200':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuthentication'

  /users/verify-email:
    post:
      tags:
        - Users
      summary: Xác thực email
      description: Xác thực email khi mới đăng ký
      operationId: verify-email
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_verify_token:
                  type: string
                  example: 'your_verification_token_here'
      responses:
        '200':
          description: Verify email thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmail'

  /users/logout:
    post:
      tags:
        - Users
      summary: Đăng xuất
      description: Đăng xuất khỏi hệ thông
      operationId: logout
      requestBody:
        description: Thông tin đăng xuất
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjUzN2Y4OTQ2YmU4ZDJlODM0NjU5MjJiIiwidG9rZW5fdHlwZSI6MCwidmVyaWZ5IjoxLCJpYXQiOjE3MTkxNDA5NDEsImV4cCI6MTcxOTE0MTg0MX0.KbW2bHQfsisq1bTzEpzcyAC_BKko0PvkaF1j6YNr6WY
        required: true
      responses:
        '200':
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuthentication'

      security:
        - BearerAuth: []

  /tweets:
    post:
      tags:
        - Tweets
      security:
        - BearerAuth: []
      summary: Tạo tweet
      description: Tạo tweet
      operationId: create tweets
      requestBody:
        description: Tạo tweet
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTweetsBody'
        required: true
      responses:
        '200':
          description: Tạo tweet thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuthentication'
        '422':
          description: Invalid input

  /bookmarks:
    post:
      tags:
        - Bookmarks
      security:
        - BearerAuth: []
      summary: Tạo bookmark
      operationId: create bookmark
      requestBody:
        description: Tạo bookmark
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookmarkBody'
        required: true
      responses:
        '200':
          description: Tạo bookmark thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '422':
          description: Invalid input
    delete:
      tags:
        - Bookmarks
      security:
        - BearerAuth: []
      summary: Huỷ bookmark
      operationId: delete bookmark
      requestBody:
        description: Huỷ bookmark
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  example: '66adeb3e856daea6adb98bdc'
        required: true
      responses:
        '200':
          description: Tạo bookmark thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '422':
          description: Invalid input

  /likes:
    post:
      tags:
        - Likes
      security:
        - BearerAuth: []
      summary: Tạo likes
      operationId: create likes
      requestBody:
        description: Tạo likes
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLikeBody'
        required: true
      responses:
        '200':
          description: Tạo like thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Like'
        '422':
          description: Invalid input
    delete:
      tags:
        - Likes
      security:
        - BearerAuth: []
      summary: Bỏ likes
      operationId: delete likes
      requestBody:
        description: Bỏ likes
        content:
          application/json:
            schema:
              type: object
              properties:
                _id:
                  type: string
                  example: '66adeb3e856daea6adb98bdc'
        required: true
      responses:
        '200':
          description: Bỏ like thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Like'
        '422':
          description: Invalid input

  /company/info:
    get:
      tags:
        - Company
      summary: Lấy thông tin công ty
      description: Lấy thông tin chi tiết về công ty
      operationId: getCompanyInfo
      responses:
        '200':
          description: Lấy thông tin công ty thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInfoResponse'
        '404':
          description: Không tìm thấy thông tin công ty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Lỗi server
    put:
      tags:
        - Company
      summary: Cập nhật thông tin công ty
      description: Cập nhật thông tin chi tiết về công ty
      operationId: updateCompanyInfo
      requestBody:
        description: Thông tin công ty cần cập nhật
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyInfoBody'
        required: true
      responses:
        '200':
          description: Cập nhật thông tin công ty thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Lỗi server

  /company/info/logo:
    put:
      tags:
        - Company
      summary: Cập nhật logo công ty
      description: Upload và cập nhật logo công ty
      operationId: updateCompanyLogo
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: File ảnh logo
      responses:
        '200':
          description: Upload logo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadImageResponse'
        '500':
          description: Lỗi server
  /company/info/img-intro:
    put:
      tags:
        - Company
      summary: Cập nhật hình ảnh giới thiệu công ty
      description: Upload và cập nhật hình ảnh giới thiệu công ty
      operationId: updateCompanyImgIntro
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: File ảnh giới thiệu
      responses:
        '200':
          description: Upload hình ảnh giới thiệu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadImageResponse'
        '500':
          description: Lỗi server
  /company/contact:
    get:
      tags:
        - Company
      summary: Lấy thông tin liên hệ
      description: Lấy thông tin liên hệ của công ty
      operationId: getContactInfo
      responses:
        '200':
          description: Lấy thông tin liên hệ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactInfoResponse'
        '500':
          description: Lỗi server

  /company/contact/customer:
    post:
      tags:
        - Company
      summary: Lưu thông tin liên hệ từ khách hàng
      description: Lưu thông tin liên hệ do khách hàng gửi
      operationId: saveCustomerContact
      requestBody:
        description: Thông tin liên hệ từ khách hàng
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerContactBody'
        required: true
      responses:
        '201':
          description: Lưu thông tin liên hệ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '500':
          description: Lỗi server

  /company/services:
    get:
      tags:
        - Company
      summary: Lấy danh sách dịch vụ
      description: Lấy danh sách tất cả dịch vụ của công ty
      operationId: getServices
      responses:
        '200':
          description: Lấy danh sách dịch vụ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesResponse'
        '500':
          description: Lỗi server
    post:
      tags:
        - Company
      summary: Tạo dịch vụ mới
      description: Thêm dịch vụ mới cho công ty
      operationId: createService
      requestBody:
        description: Thông tin dịch vụ mới
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceBody'
        required: true
      responses:
        '201':
          description: Tạo dịch vụ mới thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateServiceResponse'
        '500':
          description: Lỗi server

  /company/footer-links:
    get:
      tags:
        - Company
      summary: Lấy footer links
      description: Lấy danh sách các liên kết footer
      operationId: getFooterLinks
      responses:
        '200':
          description: Lấy footer links thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FooterLinksResponse'
        '500':
          description: Lỗi server

  /hash-tags:
    post:
      tags:
        - Hashtags
      security:
        - BearerAuth: []
      summary: Tạo hashtags
      description: Tạo hashtags
      operationId: create hashtags
      requestBody:
        description: Tạo hashtags
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: '18+ ne'
        required: true
      responses:
        '200':
          description: Tạo hashtags thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessAuthentication'
        '422':
          description: Invalid input

components:
  schemas:
    LoginBody:
      type: object
      properties:
        email:
          type: string
          example: trandat1@gmail.com
        password:
          type: string
          example: Sgod123@
      required:
        - email
        - password
    SuccessAuthentication:
      type: object
      properties:
        message:
          type: string
          example: Login Success
        token:
          type: array
          example: ['accessToken', 'refreshToken']
    UserVerifyStatus:
      type: number
      enum:
        - Unverified
        - Verified
        - Banned
      example: 1
    Me:
      type: object
      properties:
        _id:
          type: string
          example: '666d623b10aeff617a6e0f94'
        name:
          type: string
          example: 'Tran Thu Dat'
        email:
          type: string
          example: 'thudatdl123@gmail.com'
        date_of_birth:
          type: string
          format: date-time
          example: '2001-03-12T00:00:00.000Z'
        created_at:
          type: string
          format: date-time
          example: '2024-06-15T09:43:23.462Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-06-15T09:43:23.462Z'
        verify:
          $ref: '#/components/schemas/UserVerifyStatus'
        bio:
          type: string
          example: ''
        location:
          type: string
          example: ''
        website:
          type: string
          example: ''
        username:
          type: string
          example: ''
        avatar:
          type: string
          example: ''
        cover_photo:
          type: string
          example: ''
    RegisterUser:
      type: object
      properties:
        name:
          type: string
          example: 'John Doe'
        email:
          type: string
          example: 'johndoe@example.com'
        password:
          type: string
          example: '!Thudat123'
        confirm_password:
          type: string
          example: '!Thudat123'
      required:
        - name
        - email
        - password
        - confirm_password
    VerifyEmail:
      type: object
      properties:
        result:
          type: object
          properties:
            access_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjY3MzBiYWIxM2U2ZWIyZWI4MTY1NTg3IiwidG9rZW5fdHlwZSI6MCwidmVyaWZ5IjowLCJpYXQiOjE3MTg4ODk1NjksImV4cCI6MTcxODg5MDQ2OX0.uFxB9T7oR9RCNtK2zbDqlW2IH-4dshzltistTNHgkE8
            refresh_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjY3MzBiYWIxM2U2ZWIyZWI4MTY1NTg3IiwidG9rZW5fdHlwZSI6MSwidmVyaWZ5IjowLCJpYXQiOjE3MTg4ODk1NjksImV4cCI6MTcyNzUyOTU2OX0.RZmrp2moQBb9UX6t8BasSABVz2R3j8Lt64nbN4N27EY
        message:
          type: string
          example: Verify account success

    CreateTweetsBody:
      type: object
      properties:
        type:
          type: number
          example: 0
        audience:
          type: number
          example: 0
        content:
          type: string
          example: Thu Dat van vo song toan
        parent_id:
          type: string
          example: ''
        hashTags:
          type: array
          example: ['dat', 'thu', 'tran']
        mentions:
          type: array
          example: []
    Bookmark:
      type: object
      properties:
        _id:
          type: string
          example: '66aa638fcdb3c8cac017dc56'
        user_id:
          type: string
          example: '66890be2605b09784de46ed1'
        tweet_id:
          type: string
          example: '66890be2605b09784de46ed1'
        created_at:
          type: string
          example: '2024-07-31T16:17:19.694+00:00'
    Like:
      type: object
      properties:
        _id:
          type: string
          example: '66aa638fcdb3c8cac017dc56'
        user_id:
          type: string
          example: '66890be2605b09784de46ed1'
        tweet_id:
          type: string
          example: '66890be2605b09784de46ed1'
        created_at:
          type: string
          example: '2024-07-31T16:17:19.694+00:00'
    CreateBookmarkBody:
      type: object
      properties:
        tweet_id:
          type: string
          example: '66890be2605b09784de46ed1'
    CreateLikeBody:
      type: object
      properties:
        tweet_id:
          type: string
          example: '66890be2605b09784de46ed1'

    # Company schemas
    CompanyInfoResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Lấy thông tin công ty thành công'
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            name:
              type: string
              example: 'Jetwash Company'
            logo_url:
              type: string
              example: 'https://example.com/logo.png'
            intro_text:
              type: string
              example: 'Công ty chuyên về dịch vụ rửa xe'
            address:
              type: string
              example: '123 Đường ABC, Quận 1, TP.HCM'
            tax_code:
              type: string
              example: '0123456789'
            email:
              type: string
              example: 'contact@jetwash.com'
            welcome_content:
              type: string
              example: 'Chào mừng đến với Jetwash'
            img_intro:
              type: string
              example: 'https://example.com/intro.jpg'

    UpdateCompanyInfoBody:
      type: object
      properties:
        name:
          type: string
          example: 'Jetwash Company'
        logo_url:
          type: string
          example: 'https://example.com/logo.png'
        intro_text:
          type: string
          example: 'Công ty chuyên về dịch vụ rửa xe'
        address:
          type: string
          example: '123 Đường ABC, Quận 1, TP.HCM'
        tax_code:
          type: string
          example: '0123456789'
        email:
          type: string
          example: 'contact@jetwash.com'
        welcome_content:
          type: string
          example: 'Chào mừng đến với Jetwash'
        img_intro:
          type: string
          example: 'https://example.com/intro.jpg'

    ContactInfoResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Lấy thông tin liên hệ thành công'
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            phone:
              type: string
              example: '0123456789'
            email:
              type: string
              example: 'contact@jetwash.com'
            address:
              type: string
              example: '123 Đường ABC, Quận 1, TP.HCM'
            facebook:
              type: string
              example: 'https://facebook.com/jetwash'
            instagram:
              type: string
              example: 'https://instagram.com/jetwash'

    CustomerContactBody:
      type: object
      properties:
        full_name:
          type: string
          example: 'Nguyễn Văn A'
        phone_customer:
          type: string
          example: '0987654321'
        message:
          type: string
          example: 'Tôi muốn biết thêm về dịch vụ rửa xe'
      required:
        - full_name
        - phone_customer
        - message

    ServicesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Lấy danh sách dịch vụ thành công'
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              title:
                type: string
                example: 'Rửa xe ô tô'
              description:
                type: string
                example: 'Dịch vụ rửa xe ô tô chuyên nghiệp'
              image_url:
                type: string
                example: 'https://example.com/service1.jpg'
              company_id:
                type: integer
                example: 1
              created_at:
                type: string
                format: date-time
                example: '2024-08-31T10:00:00Z'

    CreateServiceBody:
      type: object
      properties:
        title:
          type: string
          example: 'Rửa xe ô tô'
        description:
          type: string
          example: 'Dịch vụ rửa xe ô tô chuyên nghiệp'
        image_url:
          type: string
          example: 'https://example.com/service1.jpg'
        company_id:
          type: integer
          example: 1
      required:
        - title
        - description

    CreateServiceResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Tạo dịch vụ mới thành công'
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1

    FooterLinksResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Lấy footer links thành công'
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              title:
                type: string
                example: 'Về chúng tôi'
              url:
                type: string
                example: '/about'
              column_position:
                type: integer
                example: 1

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 'Thao tác thành công'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 'Có lỗi xảy ra'

    UploadImageResponse:
      type: object
      properties:
        url:
          type: string
          example: 'https://example.com/uploaded-image.jpg'
        message:
          type: string
          example: 'Upload hình ảnh thành công'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
